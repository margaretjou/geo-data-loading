<!DOCTYPE html>
<html lang="en-US">
 <head>
    <meta charset="utf-8">
    <title>Covid-19 Incidences in Finland per 100k Residents</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #container {
            display: flex;
            height: 100vh;
            flex-direction: row;
            align-items: stretch;
        }
        #side-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 500px;
            height: 100%;
            overflow-y: scroll;
            z-index: 1;
            background-color: white;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }
        button {
            margin-bottom: 10px;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            border: 1px solid #ddd;
        }

        th,
        td {
            text-align: left;
            padding: 16px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        @media (max-width: 1024px) {
            #side-panel {
                display: none;
            }
        }
    </style>
 </head>

 <body>
    <main id="container">
        <div id="side-panel">

            <h2>Covid-19 Incidences in Finland per 100k Residents</h2>
           <button>Sort by Covid-19 Cases</button>

           <table>
               <tr>
                   <th>Hospital District</th>
                   <th>Covid-19 Cases per 100k Residents</th>
               </tr>
           </table>

        </div>
        <div id="map"></div>
    </main>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoibWpvdSIsImEiOiJjbWh5ZWZ6N2gwYWluMmptdTVlczZ5NXEzIn0.Ha9WIGJy4xJyUiZSR5xbNg'

        let map = new mapboxgl.Map({
            container: 'map', // container ID
            style: 'mapbox://styles/mapbox/dark-v11', // style URL
            zoom: 4, // starting zoom
            center: [35, 65] // starting center
        });

        async function geojsonFetch() { 
            // fetch geojson
            let response, covid, finland, table;
            response = await fetch('assets/covid.geojson');
            covid = await response.json();
            response = await fetch('assets/finland.json');
            finland = await response.json();

            // Function to calculate centroid of a polygon
            function getPolygonCentroid(coords) {
                let x = 0, y = 0, count = 0;
                for (let i = 0; i < coords[0].length; i++) {
                    x += coords[0][i][0];
                    y += coords[0][i][1];
                    count++;
                }
                return [x / count, y / count];
            }

            // Function to calculate centroid of a multipolygon
            function getMultiPolygonCentroid(coords) {
                let x = 0, y = 0, count = 0;
                for (let p = 0; p < coords.length; p++) {
                    for (let i = 0; i < coords[p][0].length; i++) {
                        x += coords[p][0][i][0];
                        y += coords[p][0][i][1];
                        count++;
                    }
                }
                return [x / count, y / count];
            }

            // Convert polygons to points at their centroids
            let pointFeatures = covid.features.map(feature => {
                let centroid;
                if (feature.geometry.type === 'Polygon') {
                    centroid = getPolygonCentroid(feature.geometry.coordinates);
                } else if (feature.geometry.type === 'MultiPolygon') {
                    centroid = getMultiPolygonCentroid(feature.geometry.coordinates);
                }
                return {
                    ...feature,
                    geometry: {
                        type: 'Point',
                        coordinates: centroid
                    }
                };
            });

            covid.features = pointFeatures;

            //load data to the map as new layers and table on the side.
            map.on('load', function loadingData() {

                
                map.addSource('finland', {
                    type: 'geojson',
                    data: finland
                });

                map.addLayer({
                    'id': 'finland-layer',
                    'type': 'fill',
                    'source': 'finland',
                    'paint': {
                        'fill-color': '#e7accf', // pink color fill
                        'fill-opacity': 0.5
                    }
                });

                map.addSource('covid', {
                    type: 'geojson',
                    data: covid
                });

                map.addLayer({
                    'id': 'covid-layer',
                    'type': 'circle',
                    'source': 'covid',
                    'paint': {
                        'circle-radius': [
                            'interpolate',
                            ['linear'],
                            ['to-number', ['get', 'result']],
                            15000, 5,       // low cases (~15k) = small dot
                            33000, 30       // high cases (~33k) = large dot
                        ],
                        'circle-color': 'purple',
                        'circle-opacity': 0.6,
                        'circle-stroke-width': 2,
                        'circle-stroke-color': 'black'
                    }
                });

            });

            table = document.getElementsByTagName("table")[0];
            let row, cell1, cell2, cell3;
            for (let i = 0; i < covid.features.length; i++) {
                // Create an empty <tr> element and add it to the 1st position of the table:
                row = table.insertRow(-1);
                cell1 = row.insertCell(0);
                cell2 = row.insertCell(1);
                cell1.innerHTML = covid.features[i].properties.ultimateFeatureOfInterestName;
                cell2.innerHTML = covid.features[i].properties.result;
            }

            let btn = document.getElementsByTagName("button")[0];

            btn.addEventListener('click', sortTable);

            // define the function to sort table
            function sortTable(e) {
                let table, rows, switching, i, x, y, shouldSwitch;
                table = document.getElementsByTagName("table")[0];
                switching = true;
                /*Make a loop that will continue until
                no switching has been done:*/
                while (switching) {
                    //start by saying: no switching is done:
                    switching = false;
                    rows = table.rows;
                    /*Loop through all table rows (except the
                    first, which contains table headers):*/
                    for (i = 1; i < (rows.length - 1); i++) {
                        //start by saying there should be no switching:
                        shouldSwitch = false;
                        /*Get the two elements you want to compare,
                        one from current row and one from the next:*/
                        x = parseFloat(rows[i].getElementsByTagName("td")[1].innerHTML);
                        y = parseFloat(rows[i + 1].getElementsByTagName("td")[1].innerHTML);
                        //check if the two rows should switch place:
                        if (x < y) {
                            //if so, mark as a switch and break the loop:
                            shouldSwitch = true;
                            break;
                        }
                    }
                    if (shouldSwitch) {
                        /*If a switch has been marked, make the switch
                        and mark that a switch has been done:*/
                        rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                        switching = true;
                    }
                }
            }
        };

        geojsonFetch();

   </script>
 </body>   

<html>
